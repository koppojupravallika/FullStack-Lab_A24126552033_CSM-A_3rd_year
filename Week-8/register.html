<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Passenger Registration</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <h2>BUS TICKET BOOKING SYSTEM</h2>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/register">Register</a>

            <a href="/login">Login</a>

        </div>

    </nav>


    <!-- Registration Form -->
    <div class="container">

        <h1>Passenger Registration</h1>

        <p>Create an account to book bus tickets.</p>


        <form action="/register" method="POST">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label>Age</label>

            <input
                type="number"
                name="age"
                placeholder="Enter your age"
                min="1"
                required
            >


            <label>Gender</label>

            <select name="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Mobile Number</label>

            <input
                type="tel"
                name="mobile"
                placeholder="Enter mobile number"
                pattern="[0-9]{10}"
                required
            >


            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Create username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >


            <label>Address</label>

            <textarea
                name="address"
                placeholder="Enter your address"
                required
            ></textarea>


            <button type="submit">
                Register
            </button>

        </form>


        <p class="bottom-text">

            Already have an account?

            <a href="/login">
                Login here
            </a>

        </p>

    </div>

</body>

</html>
