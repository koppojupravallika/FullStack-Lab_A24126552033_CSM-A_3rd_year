<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bus Ticket Booking</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- Navigation -->

    <nav>

        <h2>BUS TICKET BOOKING SYSTEM</h2>

        <div class="nav-links">

            <a href="/booking.html">
                Booking
            </a>

            <a href="/login">
                Logout
            </a>

        </div>

    </nav>



    <!-- Booking Section -->

    <div class="booking-container">

        <h1>Book Your Bus Ticket</h1>

        <p>
            Select your journey details and choose a bus.
        </p>



        <!-- Search Form -->

        <div class="search-box">

            <h2>Search Buses</h2>


            <form id="searchForm">


                <label>From</label>

<select id="from" required>

    <option value="">
        Select Starting Point
    </option>

    <option value="Hyderabad">
        Hyderabad
    </option>

    <option value="Vijayawada">
        Vijayawada
    </option>

    <option value="Visakhapatnam">
        Visakhapatnam
    </option>

</select>


                <label>To</label>

<select id="to" required>

    <option value="">
        Select Destination
    </option>

    <option value="Hyderabad">
        Hyderabad
    </option>

    <option value="Vijayawada">
        Vijayawada
    </option>

    <option value="Visakhapatnam">
        Visakhapatnam
    </option>

</select>
              


                <label>Journey Date</label>

                <input
                    type="date"
                    id="journeyDate"
                    required
                >



                <button type="submit">
                    Search Buses
                </button>

            </form>

        </div>



        <!-- Available Buses -->

        <div class="bus-section">

            <h2>Available Buses</h2>

            <div id="busList">

                <p>
                    Select your journey and search for buses.
                </p>

            </div>

        </div>

    </div>



    <footer>

        <p>
             Bus Ticket Booking System
        </p>

    </footer>



    <script src="js/script.js"></script>

</body>

</html>
